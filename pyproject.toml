[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symgene"
version = "0.1.0"
description = "Multi-gene symbolic regression with multi-population co-evolution"
requires-python = ">=3.10"
dependencies = [
    "deap>=1.4",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "dill>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["symgene*"]
